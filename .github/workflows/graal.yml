# Construction et publication de Graal, sur les machines de GitHub (gratuites sur ce depot PUBLIC).
# Le code reste dans le depot prive ; ce workflow le recupere avec un jeton en lecture seule.
#
# Lance par tools/publier-version.ps1 (gh workflow run graal.yml -f tag=vX.Y.Z) une fois le tag
# cree dans le depot du code, avec les nouveautes dans sa Release. Il construit en parallele
# l'APK (Android, Fire TV), le zip Windows et les deux .dmg (Mac Apple Silicon et Intel), et
# chaque fichier est publie des qu'il est pret : la Release parait avec l'APK, le zip et les
# .dmg s'y ajoutent ensuite. Une appli ne voit une version qu'une fois le fichier de sa
# plateforme dedans (Updates.kt).
#
# Secrets de CE depot (Settings > Secrets and variables > Actions) :
#   CODE_TOKEN            jeton GitHub fine-grained, "Contents: Read-only" sur Code4Wrld/Graal
#   GRAAL_LICENCE_SECRET  le graal.licenceSecret de local.properties (sans lui, Premium serait offert)
#   GRAAL_KEYSTORE2_B64, GRAAL_KEYSTORE2_PASSWORD, GRAAL_LINEAGE_B64
#                         la cle de signature au nom de Code4Wrld (graal-2026.keystore), son mot de
#                         passe et la preuve de lien avec l'ancienne cle (graal.lineage) : depuis la
#                         1.0.64, Android 13 et plus voient cette cle, les plus anciens la premiere
#   GRAAL_KEYSTORE_B64    la cle de signature de l'APK (graal.keystore), en base64 : sans la meme
#                         cle, Android refuserait la mise a jour sur les appareils
name: Graal

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la version (vX.Y.Z), deja cree dans le depot du code"
        required: true
      publish:
        description: "Publier la Release (sinon : fichiers dans les artefacts seulement)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CODE_REPO: Code4Wrld/Graal

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Code de Graal (depot prive)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CODE_REPO }}
          ref: ${{ inputs.tag }}
          token: ${{ secrets.CODE_TOKEN }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Secrets (Premium, signature)
        env:
          LICENCE: ${{ secrets.GRAAL_LICENCE_SECRET }}
          KEYSTORE: ${{ secrets.GRAAL_KEYSTORE_B64 }}
          KEYSTORE2: ${{ secrets.GRAAL_KEYSTORE2_B64 }}
          KEYSTORE2_PASSWORD: ${{ secrets.GRAAL_KEYSTORE2_PASSWORD }}
          LINEAGE: ${{ secrets.GRAAL_LINEAGE_B64 }}
          TMDB: ${{ secrets.GRAAL_TMDB_KEY }}
        run: |
          # A secret pasted with a line end would break the key or the APK: kept bare.
          LICENCE=$(printf '%s' "$LICENCE" | tr -d '\r\n'); TMDB=$(printf '%s' "$TMDB" | tr -d '\r\n')
          if [ -z "$LICENCE" ] || [ -z "$KEYSTORE" ]; then
            echo "::error::GRAAL_LICENCE_SECRET ou GRAAL_KEYSTORE_B64 absent : APK refuse (Premium offert ou mise a jour impossible)."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/graal.keystore"
          # The second key: once a device has taken an APK signed with it, one without it is refused.
          if [ -z "$KEYSTORE2" ] || [ -z "$KEYSTORE2_PASSWORD" ] || [ -z "$LINEAGE" ]; then
            echo "::error::GRAAL_KEYSTORE2_B64, GRAAL_KEYSTORE2_PASSWORD ou GRAAL_LINEAGE_B64 absent : APK refuse (mise a jour impossible sur Android 13 et plus)."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE2" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/graal-2026.keystore"
          printf '%s' "$LINEAGE" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/graal.lineage"
          printf '%s' "$KEYSTORE2_PASSWORD" | tr -d '\r\n' > "$RUNNER_TEMP/graal-2026.motdepasse"
          {
            echo "graal.licenceSecret=$LICENCE"
            echo "graal.keystore=$RUNNER_TEMP/graal.keystore"
            echo "graal.tmdbKey=$TMDB"
          } > local.properties
      - name: APK
        run: |
          chmod +x gradlew
          # Since AGP 9 the APK is its own module (androidApp); older tags still build composeApp.
          MODULE=composeApp
          [ -d androidApp ] && MODULE=androidApp
          ./gradlew ":$MODULE:assembleRelease" --console=plain -q
          VERSION=$(grep '^graal.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          mkdir -p dist
          # Signed again with both keys: Android 13 and later see the Code4Wrld key (proved to follow
          # the first one by the lineage), older ones still the first key. Checked before going out.
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$SIGNER" sign --ks "$RUNNER_TEMP/graal.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
            --next-signer --ks "$RUNNER_TEMP/graal-2026.keystore" --ks-key-alias graal --ks-pass "file:$RUNNER_TEMP/graal-2026.motdepasse" \
            --lineage "$RUNNER_TEMP/graal.lineage" --out "dist/Graal-$VERSION.apk" "$MODULE/build/outputs/apk/release/$MODULE-release.apk"
          rm -f "dist/Graal-$VERSION.apk.idsig"
          OLD=$("$SIGNER" verify --min-sdk-version 30 --max-sdk-version 30 --print-certs "dist/Graal-$VERSION.apk" | grep 'SHA-256' | head -1 | awk '{print $NF}')
          NEW=$("$SIGNER" verify --min-sdk-version 34 --max-sdk-version 34 --print-certs "dist/Graal-$VERSION.apk" | grep 'SHA-256' | head -1 | awk '{print $NF}')
          echo "cle vue par Android 12 et moins : $OLD ; par Android 13 et plus : $NEW"
          if [ "$OLD" != "fd36fe008fd8665da1e39da5756266c07c4e6cc6754de0456d30c160315726d7" ] || [ "$NEW" != "20519d498f2f16cfe0ee6c462cfc2cb4f59a8577bd353f159f00df4ab88a130c" ]; then
            echo "::error::Signature inattendue : APK refuse."
            exit 1
          fi
          ls -la dist
      - uses: actions/upload-artifact@v5
        with:
          name: Graal-android
          path: dist/*
      - name: Release (publiee avec l'APK)
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          CODE_TOKEN: ${{ secrets.CODE_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          # The notes are the code repo's Release body, written by tools/publier-version.ps1.
          GH_TOKEN="$CODE_TOKEN" gh release view "$TAG" -R "$CODE_REPO" --json body -q .body > notes.txt || echo "Graal ${TAG#v}" > notes.txt
          gh release create "$TAG" dist/* -R "${{ github.repository }}" --title "Graal ${TAG#v}" --notes-file notes.txt --latest
          GH_TOKEN="$CODE_TOKEN" gh release upload "$TAG" dist/* -R "$CODE_REPO" --clobber || echo "::warning::APK non copie dans la Release du depot du code (jeton en lecture seule)."

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Code de Graal (depot prive)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CODE_REPO }}
          ref: ${{ inputs.tag }}
          token: ${{ secrets.CODE_TOKEN }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Secret Premium
        shell: bash
        env:
          LICENCE: ${{ secrets.GRAAL_LICENCE_SECRET }}
          TMDB: ${{ secrets.GRAAL_TMDB_KEY }}
        run: |
          # A secret pasted with a line end would break the key or the APK: kept bare.
          LICENCE=$(printf '%s' "$LICENCE" | tr -d '\r\n'); TMDB=$(printf '%s' "$TMDB" | tr -d '\r\n')
          if [ -z "$LICENCE" ]; then echo "::error::GRAAL_LICENCE_SECRET absent."; exit 1; fi
          printf 'graal.licenceSecret=%s\ngraal.tmdbKey=%s\n' "$LICENCE" "$TMDB" > local.properties
      - name: libVLC
        shell: pwsh
        run: ./tools/fetch-vlc.ps1
      - name: Zip Windows
        shell: pwsh
        run: |
          ./gradlew.bat :composeApp:createReleaseDistributable --console=plain -q
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $version = ((Get-Content gradle.properties | Where-Object { $_ -match '^graal.version=' }) -split '=', 2)[1].Trim()
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path composeApp/build/compose/binaries/main-release/app/Graal -DestinationPath "dist/Graal-$version-Windows.zip"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v5
        with:
          name: Graal-windows
          path: dist/*
      - name: Ajout a la Release
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CODE_TOKEN: ${{ secrets.CODE_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          # The Release is created with the APK: wait for it (15 min at most).
          for i in $(seq 1 90); do gh release view "$TAG" -R "${{ github.repository }}" > /dev/null 2>&1 && break; sleep 10; done
          gh release upload "$TAG" dist/* -R "${{ github.repository }}" --clobber
          GH_TOKEN="$CODE_TOKEN" gh release upload "$TAG" dist/* -R "$CODE_REPO" --clobber || echo "::warning::Fichiers non copies dans la Release du depot du code (jeton en lecture seule)."

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Code de Graal (depot prive)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CODE_REPO }}
          ref: ${{ inputs.tag }}
          token: ${{ secrets.CODE_TOKEN }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: libVLC (celui de VLC.app, inclus dans l'appli)
        run: |
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 -o vlc.dmg https://get.videolan.org/vlc/3.0.21/macosx/vlc-3.0.21-universal.dmg
          hdiutil attach vlc.dmg -nobrowse -readonly -mountpoint /tmp/vlc
          mkdir -p composeApp/resources/macos/vlc
          cp -R /tmp/vlc/VLC.app/Contents/MacOS/lib composeApp/resources/macos/vlc/
          cp -R /tmp/vlc/VLC.app/Contents/MacOS/plugins composeApp/resources/macos/vlc/
          hdiutil detach /tmp/vlc
          # The plugins' index goes stale once the app is signed: without it, VLC simply scans them.
          find composeApp/resources/macos/vlc/plugins -name 'plugins.dat' -delete
      - name: Secret Premium
        env:
          LICENCE: ${{ secrets.GRAAL_LICENCE_SECRET }}
          TMDB: ${{ secrets.GRAAL_TMDB_KEY }}
        run: |
          # A secret pasted with a line end would break the key or the APK: kept bare.
          LICENCE=$(printf '%s' "$LICENCE" | tr -d '\r\n'); TMDB=$(printf '%s' "$TMDB" | tr -d '\r\n')
          if [ -z "$LICENCE" ]; then echo "::error::GRAAL_LICENCE_SECRET absent."; exit 1; fi
          printf 'graal.licenceSecret=%s\ngraal.tmdbKey=%s\n' "$LICENCE" "$TMDB" > local.properties
      - name: .dmg
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:packageReleaseDmg --console=plain -q
          VERSION=$(grep '^graal.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          mkdir -p dist
          cp composeApp/build/compose/binaries/main-release/dmg/*.dmg "dist/Graal-$VERSION-macOS-${{ matrix.arch }}.dmg"
          ls -la dist
      - uses: actions/upload-artifact@v5
        with:
          name: Graal-macOS-${{ matrix.arch }}
          path: dist/*.dmg
      - name: Ajout a la Release
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CODE_TOKEN: ${{ secrets.CODE_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          # The Release is created with the APK: wait for it (15 min at most).
          for i in $(seq 1 90); do gh release view "$TAG" -R "${{ github.repository }}" > /dev/null 2>&1 && break; sleep 10; done
          gh release upload "$TAG" dist/* -R "${{ github.repository }}" --clobber
          GH_TOKEN="$CODE_TOKEN" gh release upload "$TAG" dist/* -R "$CODE_REPO" --clobber || echo "::warning::Fichiers non copies dans la Release du depot du code (jeton en lecture seule)."

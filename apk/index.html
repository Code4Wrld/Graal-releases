<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graal – APK</title>
<meta name="robots" content="noindex">
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B081B; color: #EDEBF7; font: 18px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; }
a { color: #B79BFF; }
</style>
</head>
<body>
<div>
  <p id="msg">Téléchargement de Graal…</p>
  <p><a id="link" href="https://github.com/Code4Wrld/Graal-releases/releases/latest">Si rien ne se passe, cliquez ici.</a></p>
</div>
<script>
// graaltv.com/apk, typed in Downloader on a Fire TV: straight to the newest APK.
fetch('https://api.github.com/repos/Code4Wrld/Graal-releases/releases/latest')
  .then(r => r.ok ? r.json() : null)
  .then(rel => {
    const apk = rel && (rel.assets || []).find(a => /\.apk$/.test(a.name));
    if (apk) { document.getElementById('link').href = apk.browser_download_url; location.replace(apk.browser_download_url); }
  })
  .catch(() => {});
</script>
</body>
</html>
